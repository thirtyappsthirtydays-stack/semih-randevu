  const qs = t.questions;
  const total = qs.length;
  const [idx, setIdx] = useState(0);
  const [stamp, setStamp] = useState(0);
  const [vals, setVals] = useState({});
  const [err, setErr] = useState("");
  const [phoneCode, setPhoneCode] = useState("+90");
  const [noWhatsapp, setNoWhatsapp] = useState(false);
  const inputRef = useRef();

  const q = qs[idx];
  const val = vals[q.id] ?? (q.type === "multichoice" ? [] : "");
  const pct = Math.round((idx / total) * 100);

  useEffect(() => {
    const timer = setTimeout(() => inputRef.current?.focus(), 100);
    return () => clearTimeout(timer);
  }, [idx, stamp]);

  const validate = (overrideVal) => {
    const v = overrideVal !== undefined ? overrideVal : val;
    if (!q.required) return true;
    if (q.type === "multichoice") {
      if (!v || v.length === 0) { setErr(t.selectAtLeastOne); return false; }
      if (v.includes(q.otherLabel) && !vals.concernOther?.trim()) { setErr(t.required); return false; }
      return true;
    }
    const strV = (v === null || v === undefined) ? "" : String(v).trim();
    if (strV === "") { setErr(t.required); return false; }
    if (q.type === "number") {
      if (strV === "" || isNaN(Number(strV)) || Number(strV) <= 0) { setErr(t.invalidNumber); return false; }
    }
    if (q.noNumbers && /\d/.test(strV)) { setErr(t.invalidText); return false; }
    if (q.id === "name" && strV.trim().split(/\s+/).length < 2) { setErr(t.invalidName); return false; }
    if (q.type === "tel") {
      const digits = strV.replace(/\D/g, "");
      if (digits.length < 6) { setErr(t.invalidPhone); return false; }
    }
    return true;
  };

  const next = (overrideVal) => {
    if (!validate(overrideVal)) return;
    setErr("");
    if (idx < total - 1) { setStamp(s => s + 1); setIdx(i => i + 1); }
    else finish();
  };

  const skip = () => {
    setErr("");
    if (idx < total - 1) { setStamp(s => s + 1); setIdx(i => i + 1); }
    else finish();
  };

  const prev = () => {
    setErr("");
    if (idx === 0) { onBack(); return; }
    setStamp(s => s + 1); setIdx(i => i - 1);
  };

  const setVal = (v) => { setVals(prev => ({ ...prev, [q.id]: v })); setErr(""); };

  const finish = () => onComplete({
    name: vals.name || "", age: vals.age || "", country: vals.country || "",
    email: vals.email || "", phone: vals.phone ? `${phoneCode} ${vals.phone}${noWhatsapp ? " (WhatsApp yok)" : ""}` : "",
    concern: Array.isArray(vals.concern) ? vals.concern.join(", ") : (vals.concern || ""),
    concernOther: vals.concernOther || "",
    surgery: vals.surgery ?? null, desc: vals.desc || "", ref: vals.ref || "",
    notes: vals.notes || "",
  });

  const handleKey = (e) => {
    if (e.key === "Enter" && q.type !== "textarea") { e.preventDefault(); next(); }
  };

  // keyboard shortcuts for yesno only
  useEffect(() => {
    const handler = (e) => {
      if (q.type === "yesno") {
        if (e.key === "1" || e.key.toLowerCase() === "y") { setVal(true); setErr(""); }
        if (e.key === "2" || e.key.toLowerCase() === "n") { setVal(false); setErr(""); }
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [idx, vals]);

  return (
    <div className="tf-shell">
      {/* gold progress line */}
      <div className="tf-topline">
        <div className="tf-topline-fill" style={{ width: `${pct}%` }} />
      </div>

      {/* header */}
      <div className="tf-header">
        <div className="tf-counter-pill">{t.qOf(idx + 1, total)}</div>
      </div>

      {/* question */}
      <div className="tf-body">
        <div className="tf-card">
          <div className="tf-card-inner" key={stamp}>
            <div style={{ marginBottom: 20 }}>
              <button className="tf-back-btn" onClick={idx === 0 ? onBack : prev}>
                <span style={{ fontSize: 16 }}>‹</span> {t.back.replace("← ", "")}
              </button>
            </div>

            <div className="tf-q-eyebrow">
              <span className="tf-q-num">{String(idx + 1).padStart(2, "0")}</span>
              <span className="tf-q-arrow">→</span>
            </div>
            <div className="tf-q-text">
              {q.q}
              {q.required && <span style={{ color: "#C0392B", marginLeft: 6 }}>*</span>}
            </div>
            {q.hint && <div style={{ fontSize: 14, color: "#6B5A45", marginBottom: 20, marginTop: -16, fontWeight: 500 }}>{q.hint}</div>}

            {/* TEXT / EMAIL / NUMBER */}
            {["text","email","number"].includes(q.type) && (
              <input
                ref={inputRef}
                type={q.type === "email" ? "text" : q.type}
                inputMode={q.type === "number" ? "numeric" : q.type === "email" ? "email" : "text"}
                className={`tf-input${err ? " err" : ""}`}
                placeholder={q.ph}
                value={val}
                onChange={e => setVal(q.type === "email" ? e.target.value.replace(/\s/g, "").replace(/[^\x20-\x7E\u00C0-\u024F@._\-+]/g, "") : e.target.value)}
                onKeyDown={handleKey}
                autoComplete="off"
              />
            )}

            {/* TEL — country code + number */}
            {q.type === "tel" && (
              <>
              <div style={{ display: "flex", alignItems: "flex-end", gap: 10, borderBottom: `2px solid ${err ? "#C0392B" : "#B0A898"}`, paddingBottom: 12 }}>
                <select
                  value={phoneCode}
                  onChange={e => setPhoneCode(e.target.value)}
                  style={{ background: "transparent", border: "none", outline: "none", fontFamily: "DM Sans, sans-serif", fontSize: 18, fontWeight: 500, color: "#1A2535", cursor: "pointer", flexShrink: 0 }}
                >
                  {COUNTRY_CODES.map(c => (
                    <option key={c.code + c.name} value={c.code}>{c.flag} {c.code} {c.name}</option>
                  ))}
                </select>
                <input
                  ref={inputRef}
                  type="tel"
                  inputMode="tel"
                  style={{ flex: 1, background: "transparent", border: "none", outline: "none", fontFamily: "DM Sans, sans-serif", fontSize: "clamp(17px, 2.2vw, 22px)", fontWeight: 400, color: "#1A2535", caretColor: "#C8A96E" }}
                  placeholder="5XX XXX XX XX"
                  value={val}
                  onChange={e => setVal(e.target.value.replace(/[^\d\s\-]/g, ""))}
                  onKeyDown={handleKey}
                  autoComplete="off"
                />
              </div>
              <label style={{ display:"flex", alignItems:"center", gap:10, marginTop:16, cursor:"pointer", fontSize:14, color:"#5A6A7A" }}>
                <input
                  type="checkbox"
                  checked={noWhatsapp}
                  onChange={e => { setNoWhatsapp(e.target.checked); }}
                  style={{ width:16, height:16, accentColor:"#C8A96E", cursor:"pointer" }}
                />
                {t.noWhatsappLabel}
              </label>
              </>
            )}

            {/* TEXTAREA */}
            {q.type === "textarea" && (
              <>
                <textarea
                  ref={inputRef}
                  className={`tf-input${err ? " err" : ""}`}
                  placeholder={q.ph}
                  value={val}
                  rows={4}
                  onChange={e => setVal(e.target.value.slice(0, q.maxLen || 9999))}
                />
                {q.maxLen && (
                  <div className="tf-char-row">
                    <span className="tf-char">{(val || "").length} / {q.maxLen}</span>
                  </div>
                )}
              </>
            )}

            {/* MULTICHOICE */}
            {q.type === "multichoice" && (
              <div>
                <div className="tf-choices">
                  {q.choices.map((c, i) => {
                    const selected = Array.isArray(val) && val.includes(c);
                    return (
                      <div
                        key={c}
                        className={`tf-choice${selected ? " sel" : ""}`}
                        onClick={() => {
                          const cur = Array.isArray(val) ? val : [];
                          const newVal = selected ? cur.filter(x => x !== c) : [...cur, c];
                          setVal(newVal);
                          setErr("");
                        }}
                      >
                        <span className="tf-choice-badge" style={selected ? { background: "#C8A96E", color: "#fff", borderColor: "#C8A96E" } : {}}>
                          {selected ? "✓" : KEYS[i]}
                        </span>
                        {c}
                      </div>
                    );
                  })}
                </div>
                {/* Show detail field when "Diğer/Other" is selected */}
                {Array.isArray(val) && val.includes(q.otherLabel) && (
                  <textarea
                    className="tf-input"
                    style={{ marginTop: 16, borderBottomColor: !vals.concernOther?.trim() ? "#C0392B" : "#C8A96E" }}
                    placeholder={q.otherPh + " *"}
                    value={vals.concernOther || ""}
                    rows={3}
                    onChange={e => setVals(prev => ({ ...prev, concernOther: e.target.value }))}
                  />
                )}
                <div className="tf-cta-row">
                  <button className="tf-btn" onClick={() => next()} disabled={!Array.isArray(val) || val.length === 0} style={{ opacity: Array.isArray(val) && val.length > 0 ? 1 : 0.4 }}>
                    {t.continueBtn} <span>↓</span>
                  </button>
                </div>
              </div>
            )}

            {/* YES / NO */}
            {q.type === "yesno" && (
              <>
                <div className="tf-yesno">
                  <button
                    className={`tf-yn${val === true ? " sel" : ""}`}
                    onClick={() => { setVal(true); setErr(""); }}
                  >
                    <span className="tf-yn-emoji">👍</span>
                    {t.yes}
                  </button>
                  <button
                    className={`tf-yn${val === false ? " sel" : ""}`}
                    onClick={() => { setVal(false); setErr(""); }}
                  >
                    <span className="tf-yn-emoji">👎</span>
                    {t.no}
                  </button>
                </div>
                <div className="tf-cta-row">
                  <button className="tf-btn" onClick={() => next(val)} disabled={val === ""} style={{ opacity: val !== "" ? 1 : 0.4 }}>
                    {t.continueBtn} <span>↓</span>
                  </button>
                </div>
              </>
            )}

            {err && <div className="tf-error">⚠ {err}</div>}

            {/* CTA row — text types only */}
            {["text","email","tel","number","textarea"].includes(q.type) && (
              <div className="tf-cta-row">
                <button className="tf-btn" onClick={() => next()}>
                  {t.continueBtn} <span>↓</span>
                </button>
                <span className="tf-enter-hint">{q.type !== "textarea" && t.enterHint}</span>
                {!q.required && (
                  <button className="tf-skip-btn" onClick={skip}>{t.skipHint}</button>
                )}
              </div>
            )}
          </div>
        </div>
      </div>

      {/* dot footer */}
      <div className="tf-footer">
        <div className="tf-dots">
          {qs.map((_, i) => (
            <div key={i} className={`tf-dot${i < idx ? " done" : i === idx ? " active" : ""}`} />
          ))}
        </div>
      </div>
    </div>
  );
}

function CalEmbed({ onBooked, lang }) {
  const calLink = lang === "en"
    ? "semih-halezeroglu/online-medical-consultation"
    : "semih-halezeroglu/online-tibbi-konsultasyon";
  const namespace = lang === "en" ? "online-medical-consultation" : "online-tibbi-konsultasyon";
  useEffect(() => {
    // Load Cal.com embed script
    (function (C, A, L) {
      let p = function (a, ar) { a.q.push(ar); };
      let d = C.document;
      C.Cal = C.Cal || function () {
        let cal = C.Cal; let ar = arguments;
        if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; }
        if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return; } p(cal, ar);
      };
    })(window, "https://app.cal.com/embed/embed.js", "init");

    Cal("init", namespace, {origin:"https://app.cal.com"});
    Cal.ns[namespace]("inline", {
      elementOrSelector: "#cal-inline-embed",
      config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
      calLink: calLink,
    });
    Cal.ns[namespace]("ui", {"hideEventTypeDetails":false,"layout":"month_view"});

    // Listen for booking confirmed event
    Cal.ns[namespace]("on", {
      action: "bookingSuccessful",
      callback: () => { if(onBooked) onBooked(); }
    });
  }, [lang]);

  return (
    <div id="cal-inline-embed" style={{ width:"100%", minHeight: 600, overflow:"scroll" }} />

            <div className="how-inner">
              <h2 className="section-title">{t.landing.howTitle}</h2>
              <div className="how-grid">
                {t.landing.steps.map((s, i) => (
                  <div className="how-step" key={i}>
                    <div className="step-num">{s.n}</div>
                    <div className="step-title">{s.title}</div>
                    <div className="step-desc">{s.desc}</div>
                    {i < 3 && <div className="step-line" />}
                  </div>
                ))}
              </div>
              <div className="how-cta">
                <button className="btn-primary-lg" onClick={() => { setPage("intro"); setStep(0); }}>{t.landing.startBtn}</button>
              </div>
            </div>
          </section>
        </div>
      )}

      {/* ── INTRO / HOW IT WORKS ── */}
      {page === "intro" && (
        <div style={{ background: "#F8F6F1", paddingBottom: "80px", paddingTop: "64px" }}>
          <div style={{ maxWidth: 1000, margin: "0 auto", padding: "0 24px" }}>

            {/* TWO COLUMN HERO */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 40, alignItems: "center", padding: "48px 0 56px" }}>
              {/* RIGHT: hero image — comes first in DOM so it's on top on mobile */}
              <div style={{ borderRadius: 16, overflow: "hidden", boxShadow: "0 8px 40px rgba(27,58,92,0.15)" }}>
                <img src="hero.jpg" alt="Prof. Dr. Semih Halezeroğlu" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} />
              </div>
              {/* LEFT: title + CTA */}
              <div>
                <h1 style={{ fontFamily: "'Playfair Display', serif", fontSize: "clamp(22px, 3vw, 36px)", fontWeight: 700, color: "#1B3A5C", marginBottom: 16, lineHeight: 1.2 }}>{t.intro.title}</h1>
                <p style={{ fontSize: 16, color: "#6B7A8D", marginBottom: 32, lineHeight: 1.7 }}>{t.intro.subtitle}</p>
                <button
                  onClick={() => setPage("booking")}
                  style={{ background: "#1B3A5C", color: "#fff", border: "none", borderRadius: 10, padding: "16px 36px", fontSize: 16, fontWeight: 600, fontFamily: "'DM Sans', sans-serif", cursor: "pointer", boxShadow: "0 8px 32px rgba(27,58,92,0.2)", transition: "all 0.2s", marginBottom: 20 }}
                  onMouseOver={e => e.target.style.background = "#2A4F7C"}
                  onMouseOut={e => e.target.style.background = "#1B3A5C"}
                >
                  {t.intro.cta}
                </button>
              </div>
            </div>

            {/* HOW IT WORKS */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 20, marginBottom: 48 }}>
              {t.intro.steps.map((s, i) => (
                <div key={i}
                  onClick={i === 0 ? () => setPage("booking") : undefined}
                  style={{ background: "#fff", borderRadius: 16, padding: "28px 24px", border: i === 0 ? "1px solid #C8A96E" : "1px solid #E2DAD0", boxShadow: "0 2px 16px rgba(27,58,92,0.06)", cursor: i === 0 ? "pointer" : "default", transition: "all 0.2s" }}
                  onMouseOver={i === 0 ? e => { e.currentTarget.style.boxShadow = "0 6px 24px rgba(27,58,92,0.14)"; e.currentTarget.style.transform = "translateY(-2px)"; } : undefined}
                  onMouseOut={i === 0 ? e => { e.currentTarget.style.boxShadow = "0 2px 16px rgba(27,58,92,0.06)"; e.currentTarget.style.transform = "translateY(0)"; } : undefined}
                >
                  <div style={{ fontFamily: "'Playfair Display', serif", fontSize: 48, fontWeight: 700, color: "#C8A96E", lineHeight: 1, marginBottom: 14, opacity: 0.7 }}>{s.num}</div>
                  <div style={{ fontSize: 15, fontWeight: 700, color: "#1B3A5C", marginBottom: 10 }}>{s.title}</div>
                  <div style={{ fontSize: 13, color: "#6B7A8D", lineHeight: 1.7 }}>{s.desc}</div>
                  {i === 0 && <div style={{ marginTop: 14, fontSize: 13, fontWeight: 600, color: "#C8A96E" }}>{t.intro.cta}</div>}
                </div>
              ))}
            </div>

            {/* PHONE NOTE */}
            <p style={{ textAlign: "center", fontSize: 15, color: "#4A5A6A", lineHeight: 1.8, marginBottom: 48 }}>
              {lang === "tr"
                ? <>Alternatif olarak <strong style={{ color: "#1B3A5C" }}>0532 151 97 34</strong> numaralı telefondan asistanıma arama ya da WhatsApp yoluyla ulaşabilirsiniz.</>
                : <>Alternatively, you may reach our assistant by call or WhatsApp at <strong style={{ color: "#1B3A5C" }}>+90 532 151 97 34</strong>.</>
              }
            </p>

            {/* DOCTOR QUOTE */}
            <div style={{ background: "#1B3A5C", borderRadius: 16, padding: "36px 44px 40px", marginBottom: 48 }}>
              <div style={{ fontSize: 56, color: "#C8A96E", lineHeight: 0.7, marginBottom: 20, fontFamily: "Georgia, serif", opacity: 0.8 }}>"</div>
              <p style={{ fontSize: 19, color: "#FFFFFF", lineHeight: 1.9, margin: "0 0 24px", fontFamily: "'DM Sans', sans-serif", fontWeight: 400 }}>
                {lang === "tr"
                  ? "Sağlıkta, özellikle cerrahi müdahale gerektiren durumlarda verilen kararlar hayatidir. Akciğer hastalıkları ve kanseri gibi kritik süreçlerde ikinci bir uzman görüşü almak, hastanın tedavi yolculuğunu kökten değiştirebilir."
                  : "In healthcare, especially in situations requiring surgical intervention, the decisions made are vital. In critical processes such as lung diseases and cancer, seeking a second expert opinion can fundamentally change a patient's treatment journey."}
              </p>
              <div style={{ fontSize: 14, color: "#C8A96E", fontWeight: 600, letterSpacing: "0.04em" }}>— Prof. Dr. Semih Halezeroğlu</div>
            </div>

            {/* GOOGLE REVIEWS */}
            <div style={{ paddingTop: 0 }}>
              <ReviewsCarousel lang={lang} />
            </div>
          </div>
        </div>
      )}

            {/* ── BOOKING ── */}
      {page === "booking" && (
        <div className="booking">
          <div className="progress-bar">
            {t.progress.map((label, i) => (
              <div className="progress-step" key={i}>
                <div className={`progress-dot ${i < step ? "done" : i === step ? "active" : "idle"}`}>{i < step ? "✓" : i+1}</div>
                <span className={`progress-label ${i === step ? "active" : ""}`}>{label}</span>
                {i < 4 && <div className={`progress-connector ${i < step ? "done" : ""}`} />}
              </div>
            ))}
          </div>

          {/* STEP 0 — TYPEFORM */}
          {step === 0 && (
            <TypeformIntake
              t={t}
              onBack={() => setPage("intro")}
              onComplete={(fd) => {
                setForm(fd);
                setStep(1);
              }}
            />
          )}

          {/* STEP 1 — E-NABIZ */}
          {step === 1 && (
            <div className="flow-container">
              <div className="flow-nav"><button className="back-btn" onClick={() => setStep(0)}>{t.back}</button></div>
              <div className="flow-header">
                <h2 className="flow-title">{t.upload.title}</h2>
                <p className="flow-sub">{t.upload.subtitle}</p>
              </div>

              {!enabiz.skip && (
                <div className="card-form" style={{ marginBottom: 24 }}>
                  <div className="form-field">
                    <label className="field-label">{t.upload.tcLabel}</label>
                    <input
                      className="field-input"
                      placeholder={t.upload.tcPh}
                      value={enabiz.tc}
                      onChange={e => setEnabiz(v => ({ ...v, tc: e.target.value.replace(/\D/g,"").slice(0,11) }))}
                      inputMode="numeric"
                      maxLength={11}
                    />
                  </div>
                  <div className="form-field" style={{ marginTop: 16 }}>
                    <label className="field-label">{t.upload.passLabel}</label>
                    <input
                      className="field-input"
                      type="password"
                      placeholder={t.upload.passPh}
                      value={enabiz.pass}
                      onChange={e => setEnabiz(v => ({ ...v, pass: e.target.value }))}
                    />
                  </div>
                  <div style={{ marginTop: 20, padding: "14px 16px", background: "#F0F7F0", borderRadius: 10, borderLeft: "4px solid #4CAF50", fontSize: 13, color: "#2E5E2E", lineHeight: 1.6 }}>
                    {t.upload.safeMsg}
                  </div>
                </div>
              )}

              <div style={{ margin: "20px 0", padding: "14px 16px", background: "#FFF8EC", borderRadius: 10, borderLeft: "4px solid #C8A96E", fontSize: 13, color: "#5A4010", lineHeight: 1.7 }}>
                {t.upload.extraDocsNote}
              </div>

              <label style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", marginBottom: 24, fontSize: 14, color: "#5A6A7A" }}>
                <input
                  type="checkbox"
                  checked={enabiz.skip}
                  onChange={e => setEnabiz(v => ({ ...v, skip: e.target.checked, tc: "", pass: "" }))}
                  style={{ width: 18, height: 18, cursor: "pointer", accentColor: "#C8A96E" }}
                />
                {t.upload.noEnabiz}
              </label>

              <button
                className="btn-primary-lg"
                style={{ width: "100%", opacity: (enabiz.skip || (enabiz.tc.length === 11 && enabiz.pass.length > 0)) ? 1 : 0.4 }}
                disabled={!enabiz.skip && (enabiz.tc.length < 11 || enabiz.pass.length === 0)}
                onClick={() => {
                  const params = new URLSearchParams({
                    name: form.name, age: form.age, email: form.email,
                    phone: "'" + form.phone,
                    concern: form.concernOther ? `${form.concern} — ${form.concernOther}` : form.concern,
                    surgery: form.surgery === true ? "Evet" : form.surgery === false ? "Hayır" : "",
                    desc: form.desc, ref: form.ref,
                    enabizTC: enabiz.tc || "",
                    enabizPass: enabiz.pass || "",
                    calLang: lang,
                  });
                  const s = document.createElement("script");
                  s.src = "https://script.google.com/macros/s/AKfycbziLhMXDwmAaSgZFgWJPzOWBV_aidTpR1uDddchbCniMutWgXmKjpS05BXzBoOBPYx1xw/exec?" + params.toString();
                  document.head.appendChild(s);
                  setTimeout(() => s.remove(), 5000);
                  setStep(2);
                }}
              >
                {t.upload.next}
              </button>
              <span className="skip-link" onClick={() => {
                const params = new URLSearchParams({
                  name: form.name, age: form.age, email: form.email,
                  phone: "'" + form.phone,
                  concern: form.concernOther ? `${form.concern} — ${form.concernOther}` : form.concern,
                  surgery: form.surgery === true ? "Evet" : form.surgery === false ? "Hayır" : "",
                  desc: form.desc, ref: form.ref,
                  enabizTC: "", enabizPass: "", calLang: lang,
                });
                const s = document.createElement("script");
                s.src = "https://script.google.com/macros/s/AKfycbziLhMXDwmAaSgZFgWJPzOWBV_aidTpR1uDddchbCniMutWgXmKjpS05BXzBoOBPYx1xw/exec?" + params.toString();
                document.head.appendChild(s);
                setTimeout(() => s.remove(), 5000);
                setEnabiz(v => ({ ...v, skip: true }));
                setStep(2);
              }}>{t.upload.skip}</span>
            </div>
          )}

          {/* STEP 2 — PAYMENT */}
          {step === 2 && (
            <div className="flow-container">
              <div className="flow-nav"><button className="back-btn" onClick={() => setStep(1)}>{t.back}</button></div>
              <div className="flow-header">
                <h2 className="flow-title">{t.payment.title}</h2>
                <p className="flow-sub">{t.payment.subtitle}</p>
              </div>
              <div className="payment-summary">
                <div>
                  <div className="pay-service">{t.payment.serviceLabel}</div>
                  <div className="pay-price">{t.payment.price}</div>
                </div>
                <ul className="pay-includes">{t.payment.includes.map((inc,i) => <li key={i}>{inc}</li>)}</ul>
              </div>

              {/* Bank transfer details */}
              <div className="card-form" style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 15, fontWeight: 600, color: "#1B3A5C", marginBottom: 20 }}>
                  {lang === "tr" ? "Havale / EFT Bilgileri" : "Bank Transfer Details"}
                </div>
                {[
                  { label: lang === "tr" ? "Hesap Sahibi" : "Account Holder", value: "Halezeroğlu Sağlık Hizmetleri ve Tıbbi Danışmanlık Limited Şirketi" },
                  { label: lang === "tr" ? "Banka" : "Bank", value: "İş Bankası" },
                  { label: "IBAN", value: "TR34 0006 4000 0011 1510 3627 29" },
                  { label: lang === "tr" ? "Açıklama" : "Reference", value: lang === "tr" ? "Lütfen hastanın adını giriniz" : "Please enter the patient's name" },
                ].map(row => (
                  <div key={row.label} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: "1px solid #F0EDE8" }}>
                    <span style={{ fontSize: 13, color: "#6B7A8D", fontWeight: 500 }}>{row.label}</span>
                    <span style={{ fontSize: 14, fontWeight: 600, color: "#1B3A5C" }}>{row.value}</span>
                  </div>
                ))}
                <p style={{ fontSize: 13, color: "#6B7A8D", marginTop: 16, lineHeight: 1.6 }}>
                  {lang === "tr"
                    ? "Havaleyi gönderdikten sonra dekontunuzu WhatsApp üzerinden iletebilirsiniz."
                    : "After making the transfer, please send your receipt via WhatsApp."}
                </p>
              </div>

              <button className="pay-btn" onClick={() => setStep(3)}>
                {t.payment.pay}
              </button>
              <button
                onClick={() => setStep(3)}
                style={{ width:"100%", marginTop:12, background:"none", border:"1.5px solid #D8D0C4", borderRadius:8, padding:"14px 20px", fontSize:14, color:"#6B7A8D", cursor:"pointer", fontFamily:"DM Sans, sans-serif" }}>
                {t.payment.altPayment}
              </button>
              <p className="pay-policy">{t.payment.policy}</p>
            </div>
          )}

          {/* STEP 3 — LANGUAGE PREFERENCE */}
          {step === 3 && (
            <div className="flow-container">
              <div className="flow-nav"><button className="back-btn" onClick={() => setStep(2)}>{t.back}</button></div>
              <div className="flow-header">
                <h2 className="flow-title">{lang === "tr" ? "Randevu dilinizi seçin" : "Select your appointment language"}</h2>
                <p className="flow-sub">{lang === "tr" ? "Onay ve hatırlatma e-postalarınız seçtiğiniz dilde gönderilecektir." : "Your confirmation and reminder emails will be sent in your chosen language."}</p>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 16, marginTop: 8 }}>
                {[
                  { value: "tr", flag: "🇹🇷", label: "Türkçe", sub: "Tüm e-postalar Türkçe gönderilir" },
                  { value: "en", flag: "🇬🇧", label: "English", sub: "All emails sent in English" },
                ].map(opt => (
                  <button
                    key={opt.value}
                    onClick={() => { setCalLang(opt.value); setStep(4); }}
                    style={{
                      display: "flex", alignItems: "center", gap: 18, padding: "20px 24px",
                      background: calLang === opt.value ? "#FDF6EC" : "#FFFFFF",
                      border: `2px solid ${calLang === opt.value ? "#C8A96E" : "#E8E2D8"}`,
                      borderRadius: 14, cursor: "pointer", textAlign: "left", transition: "all 0.2s"
                    }}
                  >
                    <span style={{ fontSize: 36 }}>{opt.flag}</span>
                    <div>
                      <div style={{ fontSize: 18, fontWeight: 700, color: "#1B3A5C" }}>{opt.label}</div>
                      <div style={{ fontSize: 13, color: "#6B7A8D", marginTop: 2 }}>{opt.sub}</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>
          )}

          {/* STEP 4 — SCHEDULE */}
          {step === 4 && (
            <div className="flow-container">
              <div className="flow-nav"><button className="back-btn" onClick={() => setStep(3)}>{t.back}</button></div>
              <div className="flow-header">
                <h2 className="flow-title">{t.schedule.title}</h2>
                <p className="flow-sub">{t.schedule.subtitle}</p>
              </div>
              <CalEmbed lang={calLang || lang} onBooked={() => setStep(5)} />
            </div>
          )}

          {/* STEP 5 — CONFIRM */}
          {step === 5 && (
            <div className="flow-container">
              <div className="confirm-hero">
                <div className="confirm-icon">✅</div>
                <h2 className="confirm-title">{t.confirm.title}</h2>
                <p className="confirm-sub">{t.confirm.subtitle}</p>
              </div>
              <div className="confirm-card">
                <div className="confirm-card-title">{t.confirm.details}</div>
                <div className="confirm-row"><span className="confirm-key">{lang==="tr"?"Ad Soyad":"Name"}</span><span className="confirm-val">{form.name}</span></div>
                <div className="confirm-row"><span className="confirm-key">{lang==="tr"?"Konu":"Topic"}</span><span className="confirm-val">{form.concern}</span></div>
                <div className="confirm-row"><span className="confirm-key">Platform</span><span className="confirm-val">{form.phone === "Google Meet" ? "Google Meet" : "WhatsApp"}</span></div>
                <div className="confirm-row"><span className="confirm-key">{lang==="tr"?"Doktor":"Doctor"}</span><span className="confirm-val">Prof. Dr. Semih Halezeroğlu</span></div>
              </div>

              <div className="tips-card">
                <div className="tips-title">{t.confirm.what}</div>
                <ul className="tips-list">{t.confirm.tips.map((tip,i) => <li key={i}>{tip}</li>)}</ul>
              </div>
              <p style={{ textAlign: "center", marginTop: 20, fontSize: 15, color: "#4A5A6A", lineHeight: 1.8 }}>
                {lang === "tr"
                  ? <>Ek belge göndermek veya sorularınız için:<br/><strong style={{ fontSize: 17, color: "#1B3A5C" }}>0532 151 97 34</strong> (WhatsApp)<br/>shalezeroglu@gmail.com</>
                  : <>To send additional documents or for any questions:<br/><strong style={{ fontSize: 17, color: "#1B3A5C" }}>+90 532 151 97 34</strong> (WhatsApp)<br/>shalezeroglu@gmail.com</>
                }
              </p>
              <div style={{ textAlign:"center", marginTop:32 }}>
                <button className="back-btn" onClick={() => window.location.href = "https://www.semihhalezeroglu.com.tr"}>{t.confirm.done}</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
